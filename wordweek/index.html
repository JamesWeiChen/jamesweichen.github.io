      <div>
        <h1>百字週記</h1>
        <p>一週一批單字，每天回想一遍。</p>
      </div>
    </header>
    <section>
      <h2>使用支援</h2>
      <p>如果遇到問題，或想回報詞義、例句或發音，歡迎來信。附上 App 版本、裝置型號和遇到問題的步驟，會比較容易重現。</p>
      <p><a class="contact" href="mailto:thisis.chenwei@gmail.com?subject=%E7%99%BE%E5%AD%97%E9%80%B1%E8%A8%98">寫信給百字週記</a></p>
    </section>
    <section>
      <h2>常見問題</h2>
      <h3>如何開始今天的練習？</h3>
      <p>首次開啟時選好每週練習計畫和開始日。到了開始日，就能在「每週練習」點選「開始今日練習」。</p>
      <h3>發音需要網路嗎？</h3>
      <p>單字和片語的發音音檔內建在 App 裡，可以離線播放。發音聲音可在設定中切換。</p>
      <h3>練習紀錄存在哪裡？</h3>
      <p>練習計畫、進度和測驗紀錄保存在裝置上。裝置和系統備份由你的 Apple 裝置設定管理。</p>
    </section>
